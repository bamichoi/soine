services:
  postgres:
    image: postgres:17-alpine
    container_name: soine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soine
      POSTGRES_PASSWORD: soine_local
      POSTGRES_DB: soine
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soine -d soine']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
